name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    # Pure-Kotlin domain module: runs without an Android SDK, fast feedback on every push.
    name: domain tests + detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Domain unit tests
        run: ./gradlew -PjvmOnly=true :core:model:test --no-daemon
      - name: detekt (domain)
        run: ./gradlew -PjvmOnly=true :core:model:detekt --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-reports
          path: |
            core/model/build/reports/
            core/model/build/test-results/

  android:
    # Full build: Android lint + unit tests for every module. ubuntu-latest runners ship an
    # Android SDK; compileSdk components are downloaded by AGP on first use.
    name: android lint + unit tests
    runs-on: ubuntu-latest
    needs: domain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lint --no-daemon --continue
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --continue
      - name: detekt (all modules)
        run: ./gradlew detekt --no-daemon --continue
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/apk/debug/*.apk
